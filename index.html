<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive personal dashboard assignment starter">
    <title>Personal Dashboard | Scratch2Build</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
	<header>
		My Personal Dashboard
	</header>
	<main>
		<div class="sidebar">
			<div class="element">Home</div>
			<div class="element">Profile</div>
			<div class="element">Settings</div>
		</div>
		<div class="grid">
			<div class="card">
				<div id="analytics-grid">
					<div class="small-card">
						<h1>Completed Tasks</h1>
						2
					</div>
					<div class="small-card">
						<h1>Number of Cards</h1>
						4
					</div>
				</div>
			</div>
			<div class="card">
				<h1>Today's Tasks</h1>
				<div class="task">
					<input type="checkbox">
					Task 1
				</div>
				<div class="task">
					<input type="checkbox">
					Task 2
				</div>
				<div class="task">
					<input type="checkbox">
					Task 3
				</div>
			</div>
			<div class="card">
				<h1>Finance</h1>
				<section>
					<h2>Current Balance:</h2>
					<span>1$</span>
				</section>
				<section>
					<h2>Need to buy</h2>
					<ul>
						<li>One</li>
						<li>Two</li>
						<li>Three</li>
					</ul>
				</section>
			</div>
			<div class="card">
				<h1>Goals</h1>
				<ul>
					<li>Learning JavaScript</li>
					<li>Learning Node JS</li>
					<li>Learning PostgreSQL</li>
				</ul>
			</div>
		</div>
	</main>
  </body>
</html>
