<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive personal dashboard assignment starter">
  <title>Personal Dashboard | Scratch2Build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">

    <aside class="sidebar">
      <div class="logo">Dashboard</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">Analytics</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <div class="content-wrapper">

      <header class="header">
        <h1>Welcome back</h1>
        <div class="user">Malak Usama</div>
      </header>

      <main class="dashboard-main">

        <section class="analytics-grid">
          <div class="card">
            <h3 class="card-title">Tasks Done</h3>
            <p class="card-value">12</p>
          </div>
          <div class="card">
            <h3 class="card-title">Tasks In Progress</h3>
            <p class="card-value">5</p>
          </div>
          <div class="card">
            <h3 class="card-title">Tasks Pending</h3>
            <p class="card-value">8</p>
          </div>
        </section>

        <section class="activity-feed">
          <h3>Recent Activity</h3>
          <ul>
           <li>Completed the CSS assignment</li>
           <li>Finished OOP Assignment 2</li>
           <li>Finished OR & DS Quiz</li>
           <li>Studied Math 3</li>
          </ul>
        </section>

      </main>
    </div>
  </div>
</body>
</html>
