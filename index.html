<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive personal dashboard assignment starter">
  <title>Personal Dashboard | Scratch2Build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <!-- Write your code here -->

  <div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>MyDash</h2>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <div class="main">

    <!-- Header -->
    <header class="header">
      <h1>Dashboard</h1>
      <p>Hello, Jana</p>
    </header>

    <!-- Analytics Grid -->
    <section class="cards">
      <div class="card"><h3>Visits</h3><p>12,480</p></div>
      <div class="card"><h3>Users</h3><p>1,204</p></div>
      <div class="card"><h3>Sales</h3><p>$4,920</p></div>
      <div class="card"><h3>Orders</h3><p>312</p></div>
    </section>

    <!-- Recent Activity Feed -->
    <section class="feed">
      <h2>Recent Activity</h2>
      <ul>
        <li>You published a new project</li>
        <li>Sara commented on your post</li>
        <li>Weekly report is ready</li>
      </ul>
    </section>

  </div>
</div>



</body>
</html>
